[Font]
; Font name to use in the content view
FontName=Yu Gothic UI
; Font size (in points)
FontSize=16

[UI]
; Language: en (English), zh (Chinese), ja (Japanese)
Language=en

[Window]
; Remember window position and size
RememberPosition=1
; Last window position
WindowX=100
WindowY=100
WindowWidth=800
WindowHeight=600
