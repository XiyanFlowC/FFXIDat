; Quick Start Dialog
quickstart_title=Quick Start Guide
quickstart_message=FFXI DAT Viewer - Quick Start Guide\n\n1. Browse Files: Expand the tree on the left to navigate FFXI data files\n2. Open File: Double-click any file to view its contents\n3. Search: Press Ctrl+F or use Edit ¡ú Find to search text\n4. Change Font: Use View ¡ú Font to select a better font for Japanese text\n5. Language Filter: Use View ¡ú Language Filter to show only specific language files\n6. UI Language: Use View ¡ú UI Language to change interface language\n\nConfiguration Files:\n- Located at: %LOCALAPPDATA%\\FFXIDatEG\\config.ini\n- Use Help ¡ú Clean Preferences to remove all settings\n\nKeyboard Shortcuts:\n- Ctrl+F: Find text\n- F3: Find next\n\nFor more information, visit:\nhttps://github.com/XiyanFlowC/FFXIDat

