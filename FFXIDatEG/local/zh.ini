; 快速入门对话框
quickstart_title=快速入门指南
quickstart_message=FFXI DAT 查看器 - 快速入门指南\n\n1. 浏览文件：展开左侧树形结构以浏览 FFXI 数据文件\n2. 打开文件：双击任意文件以查看其内容\n3. 搜索：按 Ctrl+F 或使用 编辑 → 查找 来搜索文本\n4. 更改字体：使用 视图 → 字体 选择更适合显示日文的字体\n5. 语言筛选：使用 视图 → 语言筛选器 仅显示特定语言的文件\n6. 界面语言：使用 视图 → 界面语言 更改界面语言\n\n配置文件位置：\n- 位于：%LOCALAPPDATA%\\FFXIDatEG\\config.ini\n- 使用 帮助 → 清理偏好文件 可删除所有设置\n\n键盘快捷键：\n- Ctrl+F：查找文本\n- F3：查找下一个\n\n更多信息请访问：\nhttps://github.com/XiyanFlowC/FFXIDat

; 清理偏好文件
