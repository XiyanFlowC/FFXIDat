cleanprefs_confirm_message=这将删除所有已保存的偏好设置，包括：\n\n- 界面语言设置\n- 字体偏好\n- 游戏路径配置\n- 窗口位置\n\n清理完成后应用程序将关闭。\n\n是否继续？
cleanprefs_success=偏好文件已成功清理。\n应用程序即将退出。
